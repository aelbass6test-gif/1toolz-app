name: Cloudflare-only cutover validation

on:
  push:
    branches: [experiment/cloudflare-only-cutover]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-only-cutover-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated cutover branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Test D1 wallet ledger
        run: npm run test:d1-wallet-ledger
      - name: Test cutover sanitization and identity staging
        run: npm run test:cloudflare-cutover
      - name: Type-check app and Worker code
        run: npm run lint
