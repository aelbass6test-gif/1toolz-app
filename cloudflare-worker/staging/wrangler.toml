name = "1toolz-app-native-staging-synthetic-local"
main = "index.mjs"
compatibility_date = "2026-11-13"
workers_dev = true

[[d1_databases]]
binding = "SYNTHETIC_DB"
database_name = "1toolz-app-native-staging-synthetic-db-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "SYNTHETIC_MEDIA"
bucket_name = "1toolz-app-native-staging-synthetic-media-local"

# LOCAL ONLY: use `wrangler dev --local`; never use `wrangler deploy` with this config.
