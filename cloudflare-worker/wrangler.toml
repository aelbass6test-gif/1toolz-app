name = "1toolz-app"
main = "src/index.ts"
compatibility_date = "2026-09-09"
workers_dev = true

# Serve the Vite build from this Worker. API requests are handled explicitly
# by src/index.ts and never fall through to the SPA asset fallback.
[assets]
directory = "../dist"
binding = "ASSETS"

[[r2_buckets]]
binding = "R2_IMAGES"
bucket_name = "abdomedi-product-images"

# After the first successful deploy, attach the custom domain from
# Cloudflare Dashboard or uncomment this block if your account supports it.
# [[routes]]
# pattern = "api.abdomedi.com"
# custom_domain = true
[[routes]]
pattern = "abdomedi.com/images/*"
zone_id = "b548bd3bc36d71d87cddfa846c54c23e"
[[routes]]
pattern = "app.abdomedi.com/api/media/*"
zone_id = "b548bd3bc36d71d87cddfa846c54c23e"

[vars]
APP_ORIGIN = "https://app.abdomedi.com"
APP_BACKEND_URL = "https://api.abdomedi.com"
MEDIA_PUBLIC_ORIGIN = "https://abdomedi.com"
MEDIA_REQUIRE_AUTH = "true"
META_VERIFY_TOKEN = "abdomedi_whatsapp_meta_token"
OTP_FROM_NAME = "AbdoMedia Prime"
OTP_RESEND_FROM = "no-reply@abdomedi.com"
OTP_BREVO_FROM = "no-reply@abdomedi.com"
OTP_RESEND_DAILY_LIMIT = "100"
OTP_BREVO_DAILY_LIMIT = "300"
TURBO_BASE_URL = "https://platform.turbo.info"
BOSTA_PRODUCTION_BASE_URL = "https://app.bosta.co"
BOSTA_STAGING_BASE_URL = "https://stg-app.bosta.co"
