<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwaBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008060"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="pwaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#pwaBgGrad)"/>
  
  <!-- Inner Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15"/>
  
  <!-- Main Emblem Group with Shadow -->
  <g filter="url(#pwaShadow)" transform="translate(4, 0)">
    <!-- Central Package / Store Geometric Shape -->
    <path d="M256 110 L380 180 L256 250 L132 180 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M132 180 L256 250 L256 390 L132 320 Z" fill="#e2e8f0"/>
    <path d="M380 180 L256 250 L256 390 L380 320 Z" fill="#cbd5e1"/>
    
    <!-- Lightning Bolt / Fast Commerce Accent -->
    <path d="M276 135 L220 245 L260 245 L236 345 L300 235 L260 235 Z" fill="#f59e0b" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
  </g>
  
  <!-- Small Notification Badge Dot -->
  <circle cx="390" cy="120" r="28" fill="#ef4444" stroke="#ffffff" stroke-width="6"/>
  <circle cx="390" cy="120" r="10" fill="#ffffff"/>
</svg>
